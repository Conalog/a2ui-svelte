name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: License headers
        run: node scripts/check-license-headers.mjs
      - name: Formatting
        run: yarn format:check:all

  svelte:
    name: Package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: typescript/renderers/svelte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test:unit
      - run: yarn test:ssr
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:browser
      - name: Build and check the published package
        run: yarn lint:package

  explorer:
    name: Explorer end to end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/renderers/svelte/a2ui_explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @conalog/a2ui-svelte build
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: typescript/renderers/svelte/a2ui_explorer/test-results
          retention-days: 7
